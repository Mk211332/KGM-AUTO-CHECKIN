name: Instabox 机器定时唤醒

on:
  schedule:
    # GitHub Actions 的 schedule 只支持 UTC，不支持 timezone 字段。
    # UTC 16:00–18:55 = 北京时间 00:00–02:55，每 5 分钟一次。
    # 00:00 那一轮唤醒机器；00:00–02:00 每轮续租防空闲休眠；02:00 后释放租约。
    - cron: "*/5 16-18 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  INSTABOX_API_URL: "https://api.instabox.sh"
  MACHINE_ID: "m_agq6pujfouovln7vtu3nyeehqm"
  LEASE_NAME: "night-session"
  LEASE_TTL: "600"          # 租约秒数，须大于 cron 间隔（5 分钟 = 300）
  WAKE_AT_MIN: "0"          # 北京时间 00:00 开始
  CLOSE_AT_MIN: "120"       # 北京时间 02:00 结束

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 唤醒 / 续租 / 释放机器
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          set -euo pipefail

          API="$INSTABOX_API_URL"
          ID="$MACHINE_ID"
          LEASE="$LEASE_NAME"
          TTL="$LEASE_TTL"

          if [ -z "${INSTABOX_API_KEY:-}" ]; then
            echo "缺少 secret INSTABOX_API_KEY（在仓库 Settings → Secrets and variables → Actions 添加）"
            exit 1
          fi

          # 北京时间当前分钟数（Actions 运行环境为 UTC，手动加 8 小时）
          NOW_MIN=$(TZ=Asia/Shanghai date +%H%M | sed 's/^0*//')
          echo "北京时间 $(TZ=Asia/Shanghai date +%H:%M)，在线时段 $(TZ=Asia/Shanghai date -d "00:00" +%H:%M)–$(TZ=Asia/Shanghai date -d "02:00" +%H:%M)"

          # 读取机器状态
          state=$(curl -sS -m 30 -H "X-API-Key: $INSTABOX_API_KEY" \
            "$API/v1/machines/$ID" | sed -n 's/.*"state":"\([^"]*\)".*/\1/p')
          echo "当前状态: ${state:-unknown}"

          in_session=0
          if [ "$NOW_MIN" -ge "$WAKE_AT_MIN" ] && [ "$NOW_MIN" -lt "$CLOSE_AT_MIN" ]; then
            in_session=1
          fi

          if [ "$in_session" -eq 0 ]; then
            # 时段外：释放租约，让机器空闲后正常休眠
            code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -X DELETE \
              -H "X-API-Key: $INSTABOX_API_KEY" \
              "$API/v1/machines/$ID/activity-leases/$LEASE" || true)
            echo "时段外，释放租约 HTTP $code"
            exit 0
          fi

          # 时段内：非 running 先唤醒（resume 优先，start 兜底）
          if [ "$state" != "running" ]; then
            for act in resume start; do
              code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -X POST \
                -H "X-API-Key: $INSTABOX_API_KEY" \
                -H "Idempotency-Key: gh-$act-$ID-$(date +%s)" \
                "$API/v1/machines/$ID/$act" || true)
              echo "唤醒 $act HTTP $code"
              [ "$code" = "200" ] || [ "$code" = "202" ] && break
            done
            # 等待最多约 40 秒进入 running
            for i in 1 2 3 4 5 6 7 8; do
              sleep 5
              state=$(curl -sS -m 30 -H "X-API-Key: $INSTABOX_API_KEY" \
                "$API/v1/machines/$ID" | sed -n 's/.*"state":"\([^"]*\)".*/\1/p')
              echo "等待启动… ($i) 状态: ${state:-unknown}"
              [ "$state" = "running" ] && break
            done
          fi

          # running 后续租
          if [ "$state" = "running" ]; then
            code=$(curl -sS -m 30 -X PUT \
              -H "X-API-Key: $INSTABOX_API_KEY" \
              -H "Content-Type: application/json" \
              -H "Idempotency-Key: gh-lease-$ID-$(date +%s)" \
              -d "{\"ttlSeconds\":$TTL}" \
              -w '\n%{http_code}' "$API/v1/machines/$ID/activity-leases/$LEASE")
            echo "续租结果: $code"
          else
            echo "机器尚未 running，本轮跳过续租，等下一轮 cron"
          fi
